name: RADIATION validate
on:
  push: {branches: ["**"]}
  pull_request: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Structural validator (form only)
        run: python3 scripts/validate.py
      - name: Knowledge regression (locked assertions)
        run: python3 scripts/knowledge_regression.py
      - name: ICS normalizer self-test
        run: python3 scripts/ics_normalize.py --self-test
      - name: Core card tool self-test + shape check
        run: python3 scripts/nota.py --self-test && python3 scripts/nota.py --check
      - name: Module scaffold self-test
        run: python3 scripts/module_scaffold.py --self-test
      - name: Generated docs match reality (render_docs --check)
        run: python3 scripts/render_docs.py --check
      - name: Relay semantic self-test + active check (radiation_core)
        run: |
          python3 -m radiation_core.relay --self-test
          python3 -m radiation_core.relay
      - name: Status dashboard self-test (date semantics)
        run: python3 scripts/status.py --self-test
      - name: Byte-compile all scripts
        run: python3 -m py_compile scripts/*.py scripts/../radiation_core/*.py
      - name: External link census (check 13, online)
        env: {RADIATION_ONLINE: "1"}
        run: python3 scripts/validate.py

  apply-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Apply report (BLOCKING since 4500 — a red seal must block, not advise)
        run: |
          python3 scripts/verify_apply.py --self-test
          python3 scripts/verify_apply.py --strict | tee "${GITHUB_STEP_SUMMARY}"
