name: RADIATION validate
on:
  push: {branches: ["**"]}
  pull_request: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Structural validator (14 checks, form only)
        run: python3 scripts/validate.py
      - name: Knowledge regression (locked assertions)
        run: python3 scripts/knowledge_regression.py
